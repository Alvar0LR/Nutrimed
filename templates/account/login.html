{% extends 'base.html' %}
{% load static %}
{% block title %}Entrar — NutriMed{% endblock %}

{% block content %}
<div class="container login-container">
  <div class="row w-100 login-wrapper">
    <div class="col-md-6 p-5 rounded-start login-panel-izq">
      <div class="mb-3 login-brand">● NutriMed</div>
      <h2 class="login-titulo">Bienvenido</h2>
      <p class="login-subtitulo">Accede con tu cuenta de Google o con tu email.</p>
      <span class="badge mt-3 login-badge">OAuth2 · Google</span>
    </div>
    <div class="col-md-6 p-5 bg-white rounded-end border">
      <a href="{% url 'google_login' %}" class="btn btn-outline-secondary w-100 mb-3 d-flex align-items-center justify-content-center gap-2">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.7 2.5 30.2 0 24 0 14.7 0 6.7 5.4 2.7 13.3l7.8 6C12.4 13 17.8 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.1-9.9 7.1-17z"/>
          <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.7 10.7l7.8-6z"/>
          <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.2 0-11.5-4.2-13.4-9.9l-7.8 6C6.7 42.6 14.7 48 24 48z"/>
        </svg>
        Continuar con Google
      </a>
      <div class="d-flex align-items-center gap-2 mb-3">
        <hr class="flex-grow-1"><span class="text-muted small">o con email</span><hr class="flex-grow-1">
      </div>
      <form method="POST" action="{% url 'account_login' %}">
        {% csrf_token %}
        <div class="mb-3">
          <input type="email" name="login" class="form-control" placeholder="correo@email.com">
        </div>
        <div class="mb-3">
          <input type="password" name="password" class="form-control" placeholder="Contraseña">
        </div>
        <button type="submit" class="btn btn-nutrimed w-100">Entrar</button>
      </form>
      <p class="text-center mt-3 small text-muted">
        ¿No tienes cuenta? <a href="{% url 'account_signup' %}" class="enlace-verde">Regístrate</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% load static %}
{% block title %}Eliminar ingrediente — NutriMed{% endblock %}

{% block content %}
<div class="container container-confirmar py-4">
  <div class="card border-0 shadow-sm p-4 text-center">
    <h4 class="titulo-eliminar">¿Eliminar ingrediente?</h4>
    <p class="text-muted mt-2">
      Vas a eliminar <strong>{{ alimento.nombre }}</strong>. Esta acción no se puede deshacer.
    </p>
    <form method="POST" class="d-flex gap-2 justify-content-center mt-3">
      {% csrf_token %}
      <button type="submit" class="btn btn-eliminar-rojo">
        <i class="bi bi-trash me-1"></i>Sí, eliminar
      </button>
      <a href="{% url 'lista_alimentos' %}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}

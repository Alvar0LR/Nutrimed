{% extends 'base.html' %}
{% load static %}
{% block title %}Editar comida — NutriMed{% endblock %}

{% block content %}
<div class="container container-form-lg py-4">

  <div class="d-flex align-items-center gap-3 mb-4">
    <a href="{% url 'lista_comidas' %}" class="btn btn-outline-secondary btn-sm btn-volver">Volver</a>
    <h2 class="form-titulo mb-0">Editar comida</h2>
  </div>

  <div class="card border-0 shadow-sm p-4 form-card">
    <form method="POST">
      {% csrf_token %}
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label">Nombre de la comida</label>
          <input type="text" name="nombre" class="form-control" value="{{ comida.nombre }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Turno habitual</label>
          <select name="turno" class="form-select" required>
            {% for val, label in turnos %}
              <option value="{{ val }}" {% if comida.turno == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <h5 class="form-titulo mb-3">Ingredientes</h5>
      <div id="ingredientes-container">
        {% for ci in ingredientes %}
        <div class="row g-2 mb-2 ingrediente-row">
          <div class="col-md-7">
            <select name="ingrediente_id" class="form-select" required>
              <option value="" disabled selected>-- Selecciona ingrediente --</option>
              {% for alimento in alimentos %}
                <option value="{{ alimento.id }}" {% if alimento.id == ci.alimento_id %}selected{% endif %}>
                  {{ alimento.nombre }} ({{ alimento.calorias }} kcal/100g)
                </option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-3">
            <input type="number" name="cantidad" class="form-control"
                   value="{{ ci.cantidad }}"
                   placeholder="Gramos" min="0" step="0.1" required>
          </div>
          <div class="col-md-2">
            <button type="button" class="btn btn-outline-danger btn-sm w-100"
                    onclick="this.closest('.ingrediente-row').remove()">
              <i class="bi bi-trash me-1"></i>Quitar
            </button>
          </div>
        </div>
        {% empty %}
        <div class="row g-2 mb-2 ingrediente-row">
          <div class="col-md-7">
            <select name="ingrediente_id" class="form-select">
              <option value="">-- Selecciona ingrediente --</option>
              {% for alimento in alimentos %}
                <option value="{{ alimento.id }}">{{ alimento.nombre }} ({{ alimento.calorias }} kcal/100g)</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-3">
            <input type="number" name="cantidad" class="form-control" placeholder="Gramos" min="0" step="0.1">
          </div>
          <div class="col-md-2">
            <button type="button" class="btn btn-outline-danger btn-sm w-100"
                    onclick="this.closest('.ingrediente-row').remove()">
              <i class="bi bi-trash me-1"></i>Quitar
            </button>
          </div>
        </div>
        {% endfor %}
      </div>

      <button type="button" class="btn btn-outline-secondary btn-sm mt-2" onclick="añadirIngrediente()">
        <i class="bi bi-plus-lg me-1"></i>Añadir ingrediente
      </button>

      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-nutrimed">Guardar cambios</button>
        <a href="{% url 'lista_comidas' %}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/comidas_form.js' %}"></script>
{% endblock %}

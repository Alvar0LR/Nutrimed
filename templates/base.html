<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}NutriMed{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    {% if user.is_authenticated %}
    <nav class="navbar navbar-expand-lg" style="background: #0f6e56">
      <div class="container">
        <a class="navbar-brand text-white fw-500" href="/">● NutriMed</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link text-white" href="/dashboard">Dashboard</a>
          <a class="nav-link text-white" href="/plan">Plan semanal</a>
          <a class="nav-link text-white" href="/alimentos/comidas">Comidas</a>
          <a class="nav-link text-white" href="/tienda">Tienda</a>
          <a class="nav-link text-white" href="/logout">Salir</a>
        </div>
      </div>
    </nav>
    {% endif %}

    <main>{% block content %}{% endblock %}</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
